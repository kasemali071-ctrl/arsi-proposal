<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arsi, one little question 💗</title>
<style>
:root{--pink:#ff4f87;--dark:#8f1749;--pale:#fff1f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#71304c;background:radial-gradient(circle at top,#fff1f7,#ffc6dc 55%,#ff9fc3);overflow-x:hidden}.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}.floater{position:absolute;bottom:-45px;animation:up linear infinite;opacity:.7}@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}.card{width:min(100%,440px);position:relative;text-align:center;padding:24px 21px 22px;background:#ffffffdf;border:1px solid #fff;border-radius:28px;box-shadow:0 18px 60px #9b28572b;backdrop-filter:blur(8px)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#bd4777}.photo{width:90px;height:90px;object-fit:cover;object-position:center 25%;border-radius:50%;border:4px solid white;box-shadow:0 5px 18px #d64d8450;margin:13px auto 3px}.animation{height:175px;display:flex;align-items:center;justify-content:center;margin:4px auto 8px}.animation img{max-width:100%;max-height:175px;object-fit:contain;border-radius:12px}.baby{width:150px;height:150px;object-fit:contain}h1{font: bold clamp(28px,7vw,37px)/1.12 Georgia,serif;margin:8px 0 12px}p{font-size:15px;line-height:1.6;margin:0 auto 16px;max-width:330px}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:17px 0 6px}button{border:0;border-radius:999px;padding:13px 23px;font-size:15px;font-weight:800;cursor:pointer;transition:transform .15s}button:active{transform:scale(.96)}.yes{background:linear-gradient(135deg,#ff4f87,#e52768);color:white;box-shadow:0 8px 20px #ff4f8740}.no{background:#ffe4ee;color:#96365d}.music{margin-top:12px;background:#fff;border:1px solid #ffc2d8;color:#96365d;font-size:13px;padding:10px 16px}.note{font-size:11px;color:#b35b7f;margin-top:17px}.result{display:none;background:#fff0f6;border-radius:20px;padding:14px 13px;margin-top:16px}.result h2{font: bold 25px Georgia,serif;margin:4px 0 8px}.result p{margin-bottom:0}.tiny{font-size:12px;color:#a64b70;margin-top:9px}
</style></head><body><div class="floaters" id="floaters"></div><main class="card"><div class="eyebrow">A tiny message just for you</div><img class="photo" src="arsi_photo.jpg" alt="Arsi"><div class="animation" id="animation"><img class="baby" src="flower_baby.webp" alt="Cute character bringing a message"></div><h1 id="headline">Arsi, do you… do you love me? 🥹</h1><p id="intro">I wanted to ask you something special. No pressure—just a little question from me to you. 💌</p><div class="buttons"><button class="yes" onclick="chooseYes()">YES ❤️</button><button class="no" onclick="chooseNo()">NO 🙈</button></div><section class="result" id="result" aria-live="polite"></section><button class="music" id="musicButton" onclick="toggleMusic()">🎵 Play the Reel music</button><audio id="music" src="proposal_music.mp3" preload="auto" loop></audio><div class="note">Made with a little courage, lots of care & one very nervous heart ✨</div></main>
<script>
const floaters=document.getElementById('floaters');for(let i=0;i<22;i++){let e=document.createElement('span');e.className='floater';e.textContent=['💗','💕','♡','🌸','💖'][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'%';e.style.fontSize=(16+Math.random()*20)+'px';e.style.animationDuration=(8+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*15)+'s';floaters.appendChild(e)}
const audio=document.getElementById('music'),musicButton=document.getElementById('musicButton');let noCount=0;async function startMusic(){try{await audio.play();musicButton.textContent='⏸ Pause the Reel music'}catch(e){musicButton.textContent='🎵 Tap to play the Reel music'}}function toggleMusic(){if(audio.paused)startMusic();else{audio.pause();musicButton.textContent='🎵 Play the Reel music'}}
// Browsers may block autoplay; try immediately and keep the visible music button as fallback.
window.addEventListener('load',startMusic);document.addEventListener('pointerdown',()=>{if(audio.paused)startMusic()},{once:true});
function show(title,body,img,alt){const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div class="animation"><img src="${img}" alt="${alt}" style="max-height:160px"></div><h2>${title}</h2><p>${body}</p>`;r.scrollIntoView({behavior:'smooth',block:'nearest'})}
function chooseNo(){noCount++;const messages=[['Pretty please? 🥺','My tiny heart is asking very politely… just think about it once?','please_cat.gif','Cute pleading cat'],['NOOO, my eyes are leaking 😭','Even the dramatic cartoon is crying now 😂 But no pressure, promise.','crying_face.gif','Crying cartoon'],['One last tiny question? 🌷','I brought the whole flower-delivery team! You can still say no; I’ll respect your answer.','flower_baby.webp','Cute character with a flower']];const m=messages[Math.min(noCount-1,messages.length-1)];show(m[0],m[1],m[2],m[3]);if(noCount>=3){document.querySelector('.no').textContent='I mean NO 💗';document.querySelector('.no').onclick=()=>show('I understand 💗','Thank you for being honest, Arsi. I respect your feelings—no pressure at all. 🌸','crying_face.gif','Cartoon face')}}
function chooseYes(){show('YAYYY, ARSI! 🥹💖','You made this little moment extra special! Thank you for giving me a chance. Let’s take things one step at a time. 🌹','flower_baby.webp','Cute character bringing a flower');for(let i=0;i<24;i++){let e=document.createElement('span');e.textContent=['💖','💕','🌸','💗'][Math.floor(Math.random()*4)];e.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:${20+Math.random()*65}vh;font-size:${18+Math.random()*22}px;z-index:9;pointer-events:none;transition:all 1.4s ease`;document.body.appendChild(e);requestAnimationFrame(()=>{e.style.transform=`translateY(-${80+Math.random()*180}px) rotate(${Math.random()*80-40}deg)`;e.style.opacity='0'});setTimeout(()=>e.remove(),1450)}}
</script></body></html>
